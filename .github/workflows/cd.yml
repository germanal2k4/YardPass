name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/yardpass-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/yardpass-frontend
  BOT_IMAGE: ghcr.io/${{ github.repository_owner }}/yardpass-bot
  MIGRATE_IMAGE: ghcr.io/${{ github.repository_owner }}/yardpass-migrate

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: echo "sha_short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: api
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push bot
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: bot
          push: true
          tags: |
            ${{ env.BOT_IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.BOT_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push migrate
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migrate
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.MIGRATE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_BASE_URL=
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Install helmfile
        run: |
          curl -fsSL https://github.com/helmfile/helmfile/releases/download/v1.0.0-rc.7/helmfile_1.0.0-rc.7_linux_amd64.tar.gz \
            | tar xz -C /tmp helmfile
          sudo mv /tmp/helmfile /usr/local/bin/helmfile

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace=yardpass \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Generate image tag override
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          OWNER="${{ github.repository_owner }}"
          printf '%s\n' \
            "backend:" \
            "  image:" \
            "    tag: \"${TAG}\"" \
            "  migrateImage:" \
            "    repository: ghcr.io/${OWNER}/yardpass-migrate" \
            "    tag: \"${TAG}\"" \
            "frontend:" \
            "  image:" \
            "    tag: \"${TAG}\"" \
            "bot:" \
            "  image:" \
            "    repository: ghcr.io/${OWNER}/yardpass-bot" \
            "    tag: \"${TAG}\"" \
            > values-cd-override.yaml
          cat values-cd-override.yaml

      - name: Deploy with helmfile
        run: helmfile -f helmfile.yaml.gotmpl -e cd sync

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/yardpass-backend -n yardpass --timeout=120s
          kubectl rollout status deployment/yardpass-frontend -n yardpass --timeout=120s
          kubectl rollout status deployment/yardpass-bot -n yardpass --timeout=120s

      - name: Show deployment status
        if: always()
        run: kubectl get pods -n yardpass
