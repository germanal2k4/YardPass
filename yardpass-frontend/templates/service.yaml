apiVersion: v1
kind: Service
metadata:
  name: yardpass-frontend
  labels:
    {{ include "yardpass-frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    {{ include "yardpass-frontend.selector" . | nindent 4 }}
