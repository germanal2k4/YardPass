# Railway private network. Service DNS: <service-name>.railway.internal
# Placeholders __BACKEND_PORT__ / __BOT_PORT__ are replaced at container start (see deployment/railway/prometheus/docker-entrypoint.sh).
# On the Prometheus service set (optional, for dynamic bot port):
#   BOT_SCRAPE_PORT=${{Bot.PORT}}
#   BACKEND_SCRAPE_PORT=8080
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'yardpass-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend.railway.internal:__BACKEND_PORT__']
  - job_name: 'yardpass-bot'
    metrics_path: /metrics
    static_configs:
      - targets: ['bot.railway.internal:__BOT_PORT__']
