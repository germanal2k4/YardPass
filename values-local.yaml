# Local K8s overrides for minikube + podman (CRI-O)
# Postgres/Redis: docker compose -f docker-compose.data.yml up -d

backend:
  image:
    repository: localhost/yardpass/backend
    tag: latest
    pullPolicy: Never
  secrets:
    databaseUrl: "postgres://yardpass:password@host.minikube.internal:5432/yardpass?sslmode=disable"
    redisUrl: "redis://host.minikube.internal:6379/0"
  env:
    LOG_TRANSPORT: stdout
    TRACER_ENABLED: "true"
    TRACER_URL: "jaeger-collector.istio-system:4317"
    ELASTIC_URL: ""

frontend:
  image:
    repository: localhost/yardpass/frontend
    tag: latest
    pullPolicy: Never

bot:
  secrets:
    databaseUrl: "postgres://yardpass:password@host.minikube.internal:5432/yardpass?sslmode=disable"
    redisUrl: "redis://host.minikube.internal:6379/0"
