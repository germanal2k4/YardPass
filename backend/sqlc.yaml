version: "2"
sql:
  - schema: "migrations/"
    queries: "internal/repo/db/queries/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/repo/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
