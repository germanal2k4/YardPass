repositories:
  - name: istio
    url: https://istio-release.storage.googleapis.com/charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: kiali
    url: https://kiali.org/helm-charts
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  - name: istio-base
    namespace: istio-system
    createNamespace: true
    chart: istio/base
    version: 1.20.0
    wait: true

  - name: istiod
    namespace: istio-system
    chart: istio/istiod
    version: 1.20.0
    needs:
      - istio-system/istio-base
    wait: true
    values:
      - istio/istiod-values.yaml

  - name: istio-ingress
    namespace: istio-system
    chart: istio/gateway
    version: 1.20.0
    needs:
      - istio-system/istiod
    wait: false
    set:
      - name: labels.istio
        value: ingressgateway
      - name: labels.app
        value: istio-ingressgateway
      - name: service.type
        value: LoadBalancer

  - name: kiali
    namespace: istio-system
    chart: kiali/kiali-server
    version: 1.78.0
    needs:
      - istio-system/istiod
    wait: false
    values:
      - istio/kiali-values.yaml

  - name: prometheus
    namespace: istio-system
    chart: prometheus-community/kube-prometheus-stack
    needs:
      - istio-system/istiod
    wait: false
    values:
      - istio/prometheus-values.yaml

  - name: jaeger
    namespace: istio-system
    chart: ./jaeger
    needs:
      - istio-system/istiod
    wait: true
    values:
      - jaeger/values.yaml

  - name: grafana-dashboards
    namespace: istio-system
    chart: ./grafana-dashboards
    needs:
      - istio-system/prometheus
    wait: false

  - name: elasticsearch
    namespace: istio-system
    chart: ./elasticsearch
    needs:
      - istio-system/istiod
    wait: true
    timeout: 300
    values:
      - elasticsearch/values.yaml

  - name: fluent-bit
    namespace: istio-system
    chart: ./fluent-bit
    needs:
      - istio-system/elasticsearch
    wait: true
    values:
      - fluent-bit/values.yaml

  - name: cert-manager
    namespace: istio-system
    chart: jetstack/cert-manager
    wait: true
    values:
      - istio/cert-manager-values.yaml

  - name: yardpass-namespace
    namespace: default
    chart: ./yardpass-namespace
    wait: false

  - name: postgres
    namespace: yardpass
    createNamespace: true
    chart: oci://registry-1.docker.io/bitnamicharts/postgresql
    version: 18.5.14
    needs:
      - default/yardpass-namespace
    wait: false
    values:
      - istio/postgres-values.yaml

  - name: redis
    namespace: yardpass
    createNamespace: false
    chart: oci://registry-1.docker.io/bitnamicharts/redis
    version: 25.3.9
    wait: false
    values:
      - istio/redis-values.yaml

  - name: istio-config
    namespace: yardpass
    createNamespace: false
    chart: ./istio-config
    needs:
      - istio-system/istiod
      - istio-system/prometheus
    values:
      - istio-config/values.yaml

  - name: yardpass-backend
    namespace: yardpass
    createNamespace: false
    chart: ./yardpass-backend
    needs:
      - istio-system/istiod
      - yardpass/istio-config
      - yardpass/postgres
      - yardpass/redis
    values:
      - yardpass-backend/values.yaml

  - name: yardpass-frontend
    namespace: yardpass
    createNamespace: false
    chart: ./yardpass-frontend
    needs:
      - yardpass/yardpass-backend
      - yardpass/istio-config
    values:
      - yardpass-frontend/values.yaml

  - name: yardpass-bot
    namespace: yardpass
    createNamespace: false
    chart: ./yardpass-bot
    needs:
      - yardpass/yardpass-backend
      - yardpass/postgres
      - yardpass/redis
    values:
      - yardpass-bot/values.yaml
    installed: false
