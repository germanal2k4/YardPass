{{- if .Values.destinationRules.frontend.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: yardpass-frontend
  namespace: yardpass
spec:
  host: yardpass-frontend
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h2UpgradePolicy: UPGRADE
        maxRequestsPerConnection: 2
{{- end }}
