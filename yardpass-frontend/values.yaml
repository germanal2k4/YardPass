replicaCount: 1
version: v1

image:
  repository: yardpass/frontend
  tag: "latest"
  pullPolicy: IfNotPresent

appLabel: yardpass-frontend

env:
  BACKEND_URL: "http://yardpass-backend:8080"

service:
  type: ClusterIP
  port: 80
  targetPort: 80

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 2
  periodSeconds: 5
