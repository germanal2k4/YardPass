# Railway private network: DNS is <railway-service-name>.railway.internal
# Full scrape targets are injected at container start (deployment/railway/prometheus/docker-entrypoint.sh).
# Set BACKEND_SCRAPE_HOST / BOT_SCRAPE_HOST to the Railway service slugs (project canvas names).
# If job yardpass-bot is DOWN with connection errors, BOT_SCRAPE_HOST often does not match the real bot service name.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'yardpass-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['__BACKEND_TARGET__']
  - job_name: 'yardpass-bot'
    metrics_path: /metrics
    static_configs:
      - targets: ['__BOT_TARGET__']
