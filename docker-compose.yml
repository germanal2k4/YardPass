version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: yardpass
      POSTGRES_USER: yardpass
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yardpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    ports:
      - "16686:16686" # jaeger Web UI
      - "4317:4317" # otel gRPC collector

  elasticsearch:
    image: elasticsearch:7.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      - DATABASE_URL=postgres://yardpass:password@postgres:5432/yardpass?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: 
      context: ./backend
      target: api
    environment:
      - DATABASE_URL=postgres://yardpass:password@postgres:5432/yardpass?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-me}
      - JWT_ACCESS_TTL=15m
      - JWT_REFRESH_TTL=168h
      - SERVICE_TOKEN=${SERVICE_TOKEN:-your-service-token}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - RATE_LIMIT_CREATE_PASS_PER_HOUR=10
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - ELASTIC_URL=http://elasticsearch:9200
      - TRACER_URL=jaeger:4317
    ports:
      - "8080:8080"
      - "5050:5050"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  bot:
    profiles: ["bot", "full"]  # Не запускается по умолчанию
    build: 
      context: ./backend
      dockerfile: Dockerfile
      target: bot
    environment:
      - DATABASE_URL=postgres://yardpass:password@postgres:5432/yardpass?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SERVICE_TOKEN=${SERVICE_TOKEN:-your-service-token}
      - API_BASE_URL=http://backend:8080
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - ELASTIC_URL=http://elasticsearch:9200
      - TRACER_URL=jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_DEFAULT_BUILDING_ID=1
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    depends_on:
      - jaeger
      - backend
    volumes:
      - ./backend/deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - elasticsearch
      - jaeger
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/deployment/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3030:3000"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
