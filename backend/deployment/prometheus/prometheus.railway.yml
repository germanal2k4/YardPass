# Prometheus config for Railway private network.
# Service names must match Railway service names: backend, prometheus, etc.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'yardpass-backend'
    static_configs:
      - targets: ['backend.railway.internal:5050']
  # Bot is a separate process: Redis / pass metrics from Telegram run here, not on API.
  - job_name: 'yardpass-bot'
    static_configs:
      - targets: ['bot.railway.internal:5050']
