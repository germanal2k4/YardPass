apiVersion: v1
kind: Service
metadata:
  name: yardpass-backend
  labels:
    {{ include "yardpass-backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
    - name: metrics
      protocol: TCP
      port: {{ .Values.service.metricsPort }}
      targetPort: {{ .Values.service.metricsPort }}
  selector:
    {{ include "yardpass-backend.selector" . | nindent 4 }}
